version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadiq_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - leadiq_network

  redis:
    image: redis:7-alpine
    container_name: leadiq_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - leadiq_network

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: leadiq_backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    restart: unless-stopped
    networks:
      - leadiq_network

  ai-agents:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.agents
    container_name: leadiq_ai_agents
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./ai-agents:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped
    networks:
      - leadiq_network

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: leadiq_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
    restart: unless-stopped
    networks:
      - leadiq_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  leadiq_network:
    driver: bridge
    name: leadiq_network
